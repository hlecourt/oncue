name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/ci.txt
      - run: ruff check src tests benchmarks

  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the package
        run: pip install -e ".[test,web]"
      - name: Run the tests with coverage
        run: python -m pytest -q --cov=oncue --cov-report=term-missing --cov-fail-under=80

  front:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ffmpeg, the package and the front
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -e "..[test,web]"
          corepack pnpm@12.16.1 install --frozen-lockfile
      - name: Check the API types match the API
        run: corepack pnpm@12.16.1 run gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: corepack pnpm@12.16.1 run typecheck
      - run: corepack pnpm@12.16.1 run test
      - run: corepack pnpm@12.16.1 run build
      - name: Run the browser tests in Chromium and WebKit
        run: |
          corepack pnpm@12.16.1 exec playwright install --with-deps chromium webkit
          PYTHON=python corepack pnpm@12.16.1 run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  hook-without-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run the Bazarr hook the way Bazarr does, with numpy only
        run: |
          python -m venv /tmp/bazarr-like
          /tmp/bazarr-like/bin/pip install "numpy>=1.24,<3"
          ONCUE_STATE=/tmp/state PYTHONPATH=src /tmp/bazarr-like/bin/python -m oncue hook /missing.mkv /missing.fr.srt fr opensubtitles 1 2 | tee /tmp/hook.txt
          grep -q "oncue: unverified" /tmp/hook.txt

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build the web front into the package
        working-directory: frontend
        run: corepack pnpm@12.16.1 install --frozen-lockfile && corepack pnpm@12.16.1 run build
      - name: Build the wheel and the sdist
        run: pip install --require-hashes -r requirements/ci.txt && python -m build
      - name: Check the wheel carries the front and the sdist leaves node_modules out
        run: |
          unzip -l dist/*.whl | grep -q "oncue/api/static/index.html"
          ! tar tzf dist/*.tar.gz | grep -q node_modules
      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "$(ls dist/*.whl)[web]"
          /tmp/clean/bin/oncue 2>&1 | grep -q "Commands:"
          ONCUE_STATE=/tmp/state /tmp/clean/bin/oncue status
          ONCUE_STATE=/tmp/state /tmp/clean/bin/oncue ui &
          for attempt in $(seq 30); do curl --fail --silent http://127.0.0.1:8484/ready && break; sleep 1; done
          curl --fail --silent --header "Accept: text/html" http://127.0.0.1:8484/history | grep -q 'id="root"'

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag oncue:ci .
      - name: Check that ffsubsync in the image accepts the options OnCue passes
        run: docker run --rm --entrypoint python oncue:ci -c "from oncue.health import ffsubsync_status; status = ffsubsync_status(); print(status); assert status['ok']"
      - name: Scan the image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: oncue:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Start it and wait until it is ready
        run: |
          docker run --detach --name oncue --publish 8484:8484 oncue:ci
          for attempt in $(seq 30); do curl --fail --silent http://127.0.0.1:8484/ready && break; sleep 2; done
          curl --fail --silent --header "Accept: text/html" http://127.0.0.1:8484/ | grep -q 'id="root"' || { docker logs oncue; exit 1; }
