# subtitle-guard next to Bazarr, or on its own for a Jellyfin or Plex library.
# The guard must see the media at the same paths as Bazarr, and share Bazarr's /config when the hook is used.
services:
  subtitle-guard:
    build: ..
    image: subtitle-guard:latest
    command: serve --workers 2          # add --apply to let the folder watch write fixes, not only report them
    restart: unless-stopped
    ports:
      - "8484:8484"                     # web UI
    environment:
      SUBTITLE_GUARD_STATE: /config/subtitle-guard
      SUBTITLE_GUARD_BACKUPS: /data/backup/subtitle-guard
      SUBTITLE_GUARD_UI_TOKEN: ${SUBTITLE_GUARD_UI_TOKEN}
      BAZARR_URL: http://bazarr:6767    # Bazarr mode
      BAZARR_API_KEY: ${BAZARR_API_KEY}
      # SUBTITLE_GUARD_LIBRARY: /data/media/movies:/data/media/series   # standalone mode: watch these folders
    volumes:
      - ./bazarr:/config                # same folder Bazarr mounts as /config
      - /mnt/media:/data                # same folder Bazarr mounts as /data

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    volumes:
      - ./bazarr:/config
      - /mnt/media:/data
      - ../src:/opt/subtitle-guard:ro   # the package, for the post-processing hook
