[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "subtitle-guard"
dynamic = ["version"]
description = "Verify and repair subtitle timing against a subtitle track embedded in the video, with a Bazarr integration."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Hugo Lecourt" }]
keywords = ["subtitles", "srt", "sync", "bazarr", "jellyfin", "plex", "ffmpeg"]
dependencies = ["numpy>=1.24,<3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/hlecourt/subtitle-guard"
Issues = "https://github.com/hlecourt/subtitle-guard/issues"
Changelog = "https://github.com/hlecourt/subtitle-guard/blob/main/CHANGELOG.md"
Security = "https://github.com/hlecourt/subtitle-guard/security/policy"

[project.optional-dependencies]
audio = ["ffsubsync>=0.4.25,<0.6"]
test = ["pytest>=8", "pytest-cov>=5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.17.3"]

[project.scripts]
subtitle-guard = "subtitle_guard.cli:main"

[tool.hatch.version]
path = "src/subtitle_guard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 250
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM", "UP", "RUF", "PLW", "BLE", "ISC"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"src/subtitle_guard/web/server.py" = ["BLE001"]
"src/subtitle_guard/worker.py" = ["BLE001"]
"tests/test_subtitles.py" = ["RUF001"]
