[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "oncue"
dynamic = ["version"]
description = "Verify and repair subtitle timing against a subtitle track embedded in the video, with a Bazarr integration."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Hugo Lecourt" }]
keywords = ["subtitles", "srt", "sync", "bazarr", "jellyfin", "plex", "ffmpeg"]
dependencies = ["numpy>=1.24,<3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/hlecourt/oncue"
Issues = "https://github.com/hlecourt/oncue/issues"
Changelog = "https://github.com/hlecourt/oncue/blob/main/CHANGELOG.md"
Security = "https://github.com/hlecourt/oncue/security/policy"

[project.optional-dependencies]
audio = ["ffsubsync>=0.5.1,<0.6"]
web = ["fastapi>=0.162,<0.200", "uvicorn>=0.54,<0.100"]
test = ["pytest>=8", "pytest-cov>=5", "httpx2>=2.16,<3"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx2>=2.16,<3", "ruff==0.17.3"]

[project.scripts]
oncue = "oncue.cli:main"

[tool.hatch.version]
path = "src/oncue/__init__.py"

[tool.hatch.build]
artifacts = ["src/oncue/api/static/"]

[tool.hatch.build.targets.sdist]
exclude = ["frontend/node_modules", "frontend/test-results", "frontend/playwright-report"]

[tool.hatch.build.targets.wheel]
packages = ["src/oncue"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 250
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM", "UP", "RUF", "PLW", "BLE", "ISC"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"src/oncue/worker.py" = ["BLE001"]
"tests/test_subtitles.py" = ["RUF001"]
