[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "subtitle-guard"
version = "0.1.0"
description = "Verify and repair subtitle timing against a subtitle track embedded in the video, with a Bazarr integration."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
audio = ["ffsubsync>=0.4.25"]
test = ["pytest>=8"]

[project.scripts]
subtitle-guard = "subtitle_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 250
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM", "UP", "RUF", "PLW", "BLE", "ISC"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"src/subtitle_guard/web/server.py" = ["BLE001"]
"src/subtitle_guard/worker.py" = ["BLE001"]
"tests/test_subtitles.py" = ["RUF001"]
